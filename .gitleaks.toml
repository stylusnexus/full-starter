# .gitleaks.toml — secret-scanning rules for this repo.
#
# WHY THIS FILE EXISTS: gitleaks' default ruleset catches GitHub, Slack, AWS, etc.,
# but as of testing did NOT catch OpenAI (`sk-...`) or Anthropic (`sk-ant-...`) API
# keys — the exact secrets an AI app most needs to protect. We extend the defaults
# (so all built-in rules still apply) and add LLM-provider rules.
#
# gitleaks auto-loads this file when run from the repo root. CI passes it explicitly.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api03|admin01)-[a-zA-Z0-9_\-]{80,120}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key (classic, project, service-account)"
regex = '''sk-(?:proj|svcacct|admin)?-?[a-zA-Z0-9]{20}[a-zA-Z0-9_\-]{8,}'''
keywords = ["sk-"]

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''AIza[0-9A-Za-z_\-]{35}'''
keywords = ["AIza"]

[allowlist]
description = "Ignore examples, fixtures, and lockfiles"
paths = [
  '''\.example$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/).*\.lock$''',
  '''(^|/)docs/security/''',  # the security templates contain illustrative key shapes
]
# Common placeholder values that are not real secrets.
regexTarget = "match"
regexes = [
  '''EXAMPLE''',
  '''your[_-]?(api[_-]?)?key''',
  '''xxxx+''',
]
